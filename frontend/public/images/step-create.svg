<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <!-- Background -->
  <rect x="30" y="20" width="140" height="110" rx="12" fill="#2BAB6F" opacity="0.08"/>
  
  <!-- Form card -->
  <rect x="50" y="35" width="100" height="80" rx="8" fill="white" stroke="#2BAB6F" stroke-width="1.5"/>
  
  <!-- Title -->
  <rect x="60" y="45" width="60" height="6" rx="3" fill="#2BAB6F" opacity="0.6"/>
  
  <!-- Input field: Nombre -->
  <rect x="60" y="58" width="80" height="14" rx="4" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="65" y="68" fill="#999" font-size="7">Mi clase multigrado</text>
  
  <!-- Grade chips -->
  <rect x="60" y="78" width="18" height="10" rx="5" fill="#2BAB6F" opacity="0.8"/>
  <text x="69" y="85" text-anchor="middle" fill="white" font-size="6" font-weight="bold">2°</text>
  <rect x="82" y="78" width="18" height="10" rx="5" fill="#7B5EA7" opacity="0.8"/>
  <text x="91" y="85" text-anchor="middle" fill="white" font-size="6" font-weight="bold">3°</text>
  <rect x="104" y="78" width="18" height="10" rx="5" fill="#F07C4D" opacity="0.8"/>
  <text x="113" y="85" text-anchor="middle" fill="white" font-size="6" font-weight="bold">4°</text>
  
  <!-- Create button -->
  <rect x="60" y="95" width="50" height="12" rx="6" fill="#2BAB6F"/>
  <text x="85" y="103" text-anchor="middle" fill="white" font-size="7" font-weight="bold">Crear</text>
  
  <!-- Plus icon top-right -->
  <circle cx="155" cy="30" r="10" fill="#2BAB6F" opacity="0.2"/>
  <line x1="155" y1="25" x2="155" y2="35" stroke="#2BAB6F" stroke-width="2" stroke-linecap="round"/>
  <line x1="150" y1="30" x2="160" y2="30" stroke="#2BAB6F" stroke-width="2" stroke-linecap="round"/>
</svg>
