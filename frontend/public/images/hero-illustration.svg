<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Fondo Base -->
    
  <!-- Formas abstractas de fondo -->
  <circle cx="400" cy="320" r="280" fill="#F0EBE1"/>
  <path d="M 100 500 Q 200 350 400 400 T 750 250 L 750 600 L 100 600 Z" fill="#EAE5D9"/>

  <!-- Mesa abstracta -->
  <path d="M 150 500 L 650 500 L 720 600 L 80 600 Z" fill="#D8D0E5"/>
  <rect x="150" y="500" width="500" height="20" rx="10" fill="#7B5EA7"/>

  <!-- Cuerpo del maestro (Geometría abstracta superpuesta) -->
  <path d="M 230 500 C 230 280, 570 280, 570 500 Z" fill="#F07C4D"/>
  <path d="M 310 500 C 310 320, 520 250, 570 500 Z" fill="#7B5EA7"/>
  <path d="M 230 500 C 230 400, 400 350, 430 500 Z" fill="#2BAB6F"/>

  <!-- Cabeza minimalista -->
  <circle cx="400" cy="230" r="50" fill="#E8A995"/>
  <!-- Cabello abstracto -->
  <path d="M 350 230 C 340 160, 460 160, 450 230 C 420 180, 380 180, 350 230 Z" fill="#3D2C4A"/>
  <circle cx="430" cy="195" r="15" fill="#3D2C4A"/>

  <!-- Libro geométrico (Manos abstraídas) -->
  <g transform="translate(370, 320) rotate(-12)">
    <!-- Tapa del libro -->
    <rect width="90" height="130" rx="6" fill="#2BAB6F"/>
    <rect x="10" y="0" width="15" height="130" fill="#1C8253"/>
    <!-- Detalles del libro -->
    <rect x="35" y="20" width="40" height="10" rx="5" fill="#E8F4EE"/>
    <rect x="35" y="40" width="30" height="8" rx="4" fill="#E8F4EE"/>
    <circle cx="55" cy="90" r="18" fill="#1C8253"/>
    <!-- Figura que sugiere una mano sosteniendo -->
    <rect x="70" y="60" width="30" height="40" rx="15" fill="#E8A995"/>
  </g>

  <!-- Burbujas de grados (Colores sólidos y vibrantes) -->
  <g font-family="sans-serif" font-weight="bold" fill="white">
    <!-- 2° Grado -->
    <circle cx="200" cy="300" r="45" fill="#F07C4D"/>
    <text x="200" y="312" text-anchor="middle" font-size="32">2°</text>
    
    <!-- 3° Grado -->
    <circle cx="600" cy="220" r="40" fill="#4A90D9"/>
    <text x="600" y="232" text-anchor="middle" font-size="28">3°</text>
    
    <!-- 4° Grado -->
    <circle cx="680" cy="330" r="50" fill="#7B5EA7"/>
    <text x="680" y="344" text-anchor="middle" font-size="36">4°</text>
    
    <!-- 5° Grado -->
    <circle cx="610" cy="430" r="40" fill="#2BAB6F"/>
    <text x="610" y="442" text-anchor="middle" font-size="28">5°</text>
  </g>

  <!-- Tarjetas de actividad flotantes (Estilo blocky/abstracto) -->
  <g transform="translate(100, 100) rotate(-8)">
    <rect width="110" height="80" rx="12" fill="white" stroke="#2BAB6F" stroke-width="5"/>
    <rect x="15" y="15" width="80" height="10" rx="5" fill="#2BAB6F"/>
    <rect x="15" y="40" width="55" height="8" rx="4" fill="#E0E0E0"/>
    <rect x="15" y="58" width="40" height="8" rx="4" fill="#E0E0E0"/>
  </g>

  <g transform="translate(540, 80) rotate(12)">
    <rect width="100" height="70" rx="10" fill="white" stroke="#7B5EA7" stroke-width="5"/>
    <rect x="15" y="15" width="70" height="10" rx="5" fill="#7B5EA7"/>
    <rect x="15" y="35" width="50" height="8" rx="4" fill="#E0E0E0"/>
    <rect x="15" y="50" width="30" height="8" rx="4" fill="#E0E0E0"/>
  </g>

  <!-- Elementos decorativos (Estrellas y puntos geométricos) -->
  <!-- Estrella Naranja -->
  <polygon points="290,110 295,130 315,135 295,140 290,160 285,140 265,135 285,130" fill="#F07C4D"/>
  <!-- Estrella Verde -->
  <polygon points="490,140 493,155 508,158 493,161 490,176 487,161 472,158 487,155" fill="#2BAB6F"/>
  
  <circle cx="160" cy="420" r="10" fill="#7B5EA7"/>
  <circle cx="530" cy="340" r="12" fill="#F07C4D"/>
  <circle cx="340" cy="140" r="6" fill="#4A90D9"/>
</svg>
