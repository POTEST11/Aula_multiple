<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <!-- Background -->
  <rect x="30" y="20" width="140" height="110" rx="12" fill="#7B5EA7" opacity="0.08"/>
  
  <!-- Chat window -->
  <rect x="45" y="30" width="110" height="90" rx="8" fill="white" stroke="#7B5EA7" stroke-width="1.5"/>
  
  <!-- Chat header bar -->
  <rect x="45" y="30" width="110" height="16" rx="8" fill="#7B5EA7" opacity="0.1"/>
  <circle cx="55" cy="38" r="3" fill="#2BAB6F"/>
  <rect x="62" y="36" width="40" height="4" rx="2" fill="#7B5EA7" opacity="0.4"/>
  
  <!-- User message bubble -->
  <rect x="70" y="52" width="75" height="18" rx="6" fill="#7B5EA7" opacity="0.15"/>
  <rect x="76" y="57" width="50" height="3" rx="1.5" fill="#7B5EA7" opacity="0.5"/>
  <rect x="76" y="63" width="35" height="3" rx="1.5" fill="#7B5EA7" opacity="0.3"/>
  
  <!-- AI response bubble -->
  <rect x="55" y="76" width="85" height="22" rx="6" fill="#2BAB6F" opacity="0.12"/>
  <rect x="61" y="81" width="55" height="3" rx="1.5" fill="#2BAB6F" opacity="0.5"/>
  <rect x="61" y="87" width="70" height="3" rx="1.5" fill="#2BAB6F" opacity="0.3"/>
  <rect x="61" y="93" width="40" height="3" rx="1.5" fill="#2BAB6F" opacity="0.3"/>
  
  <!-- Input bar -->
  <rect x="50" y="103" width="100" height="12" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="58" y="111" fill="#999" font-size="6">Fracciones para 3° y 4°...</text>
  
  <!-- Send button -->
  <circle cx="143" cy="109" r="5" fill="#7B5EA7"/>
  <path d="M141 109 L145 109 M143 107 L145 109 L143 111" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Sparkle -->
  <path d="M162 28 L164 23 L166 28 L164 33 Z" fill="#F07C4D" opacity="0.6"/>
</svg>
