<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <!-- Background -->
  <rect x="30" y="20" width="140" height="110" rx="12" fill="#F07C4D" opacity="0.08"/>
  
  <!-- Main result card -->
  <rect x="40" y="30" width="120" height="95" rx="8" fill="white" stroke="#F07C4D" stroke-width="1.5"/>
  
  <!-- Title bar -->
  <rect x="48" y="38" width="70" height="5" rx="2.5" fill="#F07C4D" opacity="0.6"/>
  <text x="48" y="42" fill="#F07C4D" font-size="5" opacity="0">Actividad Ancla</text>
  
  <!-- Anchor activity preview -->
  <rect x="48" y="48" width="100" height="3" rx="1.5" fill="#666" opacity="0.3"/>
  <rect x="48" y="54" width="80" height="3" rx="1.5" fill="#666" opacity="0.2"/>
  
  <!-- Variant cards (collapsed) -->
  <!-- Grade 2 -->
  <rect x="48" y="64" width="104" height="16" rx="4" fill="#2BAB6F" opacity="0.1" stroke="#2BAB6F" stroke-width="0.8"/>
  <circle cx="56" cy="72" r="5" fill="#2BAB6F" opacity="0.8"/>
  <text x="56" y="74" text-anchor="middle" fill="white" font-size="5" font-weight="bold">2°</text>
  <rect x="65" y="69" width="50" height="3" rx="1.5" fill="#2BAB6F" opacity="0.4"/>
  <rect x="65" y="74" width="35" height="2.5" rx="1.25" fill="#2BAB6F" opacity="0.2"/>
  <path d="M144 69 L148 72 L144 75" stroke="#2BAB6F" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  
  <!-- Grade 3 -->
  <rect x="48" y="84" width="104" height="16" rx="4" fill="#7B5EA7" opacity="0.1" stroke="#7B5EA7" stroke-width="0.8"/>
  <circle cx="56" cy="92" r="5" fill="#7B5EA7" opacity="0.8"/>
  <text x="56" y="94" text-anchor="middle" fill="white" font-size="5" font-weight="bold">3°</text>
  <rect x="65" y="89" width="50" height="3" rx="1.5" fill="#7B5EA7" opacity="0.4"/>
  <rect x="65" y="94" width="35" height="2.5" rx="1.25" fill="#7B5EA7" opacity="0.2"/>
  <path d="M144 89 L148 92 L144 95" stroke="#7B5EA7" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  
  <!-- Grade 4 -->
  <rect x="48" y="104" width="104" height="16" rx="4" fill="#F07C4D" opacity="0.1" stroke="#F07C4D" stroke-width="0.8"/>
  <circle cx="56" cy="112" r="5" fill="#F07C4D" opacity="0.8"/>
  <text x="56" y="114" text-anchor="middle" fill="white" font-size="5" font-weight="bold">4°</text>
  <rect x="65" y="109" width="50" height="3" rx="1.5" fill="#F07C4D" opacity="0.4"/>
  <rect x="65" y="114" width="35" height="2.5" rx="1.25" fill="#F07C4D" opacity="0.2"/>
  <path d="M144 109 L148 112 L144 115" stroke="#F07C4D" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  
  <!-- Checkmark -->
  <circle cx="165" cy="28" r="8" fill="#2BAB6F" opacity="0.9"/>
  <path d="M161 28 L164 31 L169 25" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
