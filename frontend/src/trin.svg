<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
 
  <rect width="100%" height="100%" fill="#f5f3e9"/>

  <!-- Outer Circle -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="#364e59" stroke-width="8"/>

  <!-- Tree Canopy -->
  <g fill="#2f663e">
    <circle cx="250" cy="125" r="75"/>
    <circle cx="180" cy="145" r="60"/>
    <circle cx="320" cy="145" r="60"/>
    <circle cx="130" cy="200" r="55"/>
    <circle cx="370" cy="200" r="55"/>
    <circle cx="140" cy="260" r="50"/>
    <circle cx="360" cy="260" r="50"/>
    <circle cx="180" cy="285" r="45"/>
    <circle cx="320" cy="285" r="45"/>
    <circle cx="250" cy="180" r="80"/>
    <circle cx="200" cy="230" r="70"/>
    <circle cx="300" cy="230" r="70"/>
  </g>

  <!-- Branches (Negative Space/Cream) -->
  <g fill="#f5f3e9">
    <!-- Left branch -->
    <path d="M 218 245
             C 185 255, 150 235, 135 215
             C 155 225, 175 235, 185 235
             C 175 210, 165 190, 160 180
             C 180 200, 195 225, 205 235
             C 210 238, 215 240, 218 240 Z"/>
    <!-- Right branch -->
    <path d="M 282 245
             C 315 255, 350 235, 365 215
             C 345 225, 325 235, 315 235
             C 325 210, 335 190, 340 180
             C 320 200, 305 225, 295 235
             C 290 238, 285 240, 282 240 Z"/>
  </g>

  <!-- Pencil Base Silhouette (for outline) -->
  <path d="M 224 145
           C 224 110, 276 110, 276 145
           L 284 145 L 284 179
           L 280 179 L 280 330
           L 250 420
           L 220 330 L 220 179
           L 216 179 L 216 145 Z"
        fill="#f5f3e9" stroke="#f5f3e9" stroke-width="12" stroke-linejoin="round"/>

  <!-- Pencil Eraser Top -->
  <path d="M 224 145 C 224 112, 276 112, 276 145 Z" fill="#364e59"/>

  <!-- Metal Band -->
  <rect x="216" y="147" width="68" height="30" rx="4" fill="#364e59"/>
  <line x1="214" y1="156" x2="286" y2="156" stroke="#f5f3e9" stroke-width="4" stroke-linecap="round"/>
  <line x1="214" y1="168" x2="286" y2="168" stroke="#f5f3e9" stroke-width="4" stroke-linecap="round"/>

  <!-- Pencil Body Line Top Separator -->
  <line x1="216" y1="179" x2="286" y2="179" stroke="#f5f3e9" stroke-width="4"/>

  <!-- Cone -->
  <path d="M 220 325 L 250 420 L 280 325 Z" fill="#c59e7a"/>

  <!-- Pencil Body with Scalloped Bottom -->
  <path d="M 220 181
           L 280 181
           L 280 330
           A 10 12 0 0 1 260 330
           A 10 12 0 0 1 240 330
           A 10 12 0 0 1 220 330
           Z" fill="#b58b66"/>

  <!-- Vertical Lines (Cream) -->
  <line x1="240" y1="181" x2="240" y2="330" stroke="#f5f3e9" stroke-width="4"/>
  <line x1="260" y1="181" x2="260" y2="330" stroke="#f5f3e9" stroke-width="4"/>

  <!-- Scallop Outline -->
  <path d="M 280 330
           A 10 12 0 0 1 260 330
           A 10 12 0 0 1 240 330
           A 10 12 0 0 1 220 330"
        fill="none" stroke="#f5f3e9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Graphite Tip -->
  <path d="M 239 385 Q 250 390 261 385 L 250 420 Z" fill="#364e59"/>
</svg>
